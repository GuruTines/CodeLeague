[package]
name = "codeleague-judge"
version = "0.1.0"
edition = "2021"
description = "Isolated code compilation & judging microservice for CodeLeague"
rust-version = "1.80"

[lib]
name = "codeleague_judge"
path = "src/lib.rs"

[[bin]]
name = "codeleague-judge"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "fs", "net"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"   # CatchPanicLayer relies on unwinding
